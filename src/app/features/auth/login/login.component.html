<section class="login-route route-surface" aria-labelledby="login-title">
  <div class="login-card">
    <div class="login-card__plane" aria-hidden="true"></div>
    <p class="login-card__product">MetaFrame</p>

    <div class="login-card__form">
      <h1 id="login-title">Sign in</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="form-field">
          <label for="username">Username</label>
          <input
            #usernameInput
            id="username"
            type="text"
            formControlName="username"
            autocomplete="username"
            [attr.aria-invalid]="fieldMessage('username') ? 'true' : 'false'"
            [attr.aria-describedby]="fieldMessage('username') ? 'username-error' : null"
          >
          <p *ngIf="fieldMessage('username')" id="username-error" class="field-error">
            {{ fieldMessage('username') }}
          </p>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input
            #passwordInput
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            [attr.aria-invalid]="fieldMessage('password') ? 'true' : 'false'"
            [attr.aria-describedby]="fieldMessage('password') ? 'password-error' : null"
          >
          <p *ngIf="fieldMessage('password')" id="password-error" class="field-error">
            {{ fieldMessage('password') }}
          </p>
        </div>

        <button type="submit" class="button button--primary" [disabled]="isBusy">
          {{ isBusy ? 'Signing in' : 'Sign in' }}
        </button>
      </form>
    </div>
  </div>
</section>
