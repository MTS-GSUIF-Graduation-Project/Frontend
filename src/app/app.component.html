<div *ngIf="navigating()" class="route-progress" role="progressbar" aria-label="Loading page"></div>

<a class="skip-link" [routerLink]="[]" fragment="main-content" queryParamsHandling="preserve">Skip to content</a>

<header class="top-bar">
  <div class="top-bar__inner">
    <a class="top-bar__brand" [routerLink]="auth.isLoggedIn() ? '/home' : '/'" aria-label="GSUIF home">
      <ng-container *ngTemplateOutlet="brandMark"></ng-container>
      <span>GSUIF</span>
    </a>
    <nav class="top-bar__nav" aria-label="Primary">
      <a *ngIf="auth.isLoggedIn()" class="top-bar__link" routerLink="/home" routerLinkActive="top-bar__link--active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Home</a>
      <a *ngIf="auth.isLoggedIn()" class="top-bar__link" routerLink="/projects" routerLinkActive="top-bar__link--active" ariaCurrentWhenActive="page">Projects</a>
      <div class="top-bar__account">
        <app-theme-toggle></app-theme-toggle>
        <a *ngIf="!auth.isLoggedIn()" class="top-bar__link" routerLink="/login" routerLinkActive="top-bar__link--active" ariaCurrentWhenActive="page">Sign in</a>
        <ng-container *ngIf="auth.isLoggedIn()">
          <a class="top-bar__help" routerLink="/" aria-label="About GSUIF" title="About GSUIF">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M9.6 9.3a2.5 2.5 0 0 1 4.85.85c0 1.65-2.45 2.2-2.45 3.6"></path>
              <path d="M12 17h.01"></path>
            </svg>
          </a>
          <span *ngIf="auth.getUsername()" class="top-bar__avatar" aria-hidden="true">{{ initials }}</span>
          <span *ngIf="auth.getUsername()" class="top-bar__user">{{ auth.getUsername() }}</span>
          <span class="top-bar__divider" aria-hidden="true"></span>
          <button type="button" class="button button--logout" (click)="auth.logout()">Sign out</button>
        </ng-container>
      </div>
    </nav>
  </div>
</header>

<app-notification-banner
  *ngIf="notifications.message() as message"
  [message]="message"
  (dismissed)="notifications.clear()"
></app-notification-banner>

<main #mainContent id="main-content" class="page-shell" tabindex="-1">
  <router-outlet></router-outlet>
</main>

<footer class="site-footer">
  <span class="site-footer__brand">
    <ng-container *ngTemplateOutlet="brandMark"></ng-container>
    <span>GSUIF</span>
  </span>
  <span class="site-footer__tagline">Metadata-driven UI framework</span>
</footer>

<ng-template #brandMark>
  <svg class="brand-mark" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
    <path d="M9 4H4v16h5M15 4h5v16h-5"></path>
  </svg>
</ng-template>
